[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-vector"
version = "0.1.0"
description = "A zero-dependency vector database in pure Python with HNSW indexing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "WsNodeX" }]
keywords = [
    "vector-database",
    "hnsw",
    "embeddings",
    "similarity-search",
    "nearest-neighbour",
    "ann",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = []

[project.scripts]
lumen = "lumen.cli:main"

[project.urls]
Homepage = "https://github.com/WsNodeX/lumen"
Repository = "https://github.com/WsNodeX/lumen"

[tool.setuptools.packages.find]
include = ["lumen*"]
